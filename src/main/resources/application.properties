# Включаем Project Loom (Виртуальные потоки Java 21) для всего приложения
spring.threads.virtual.enabled=true

# Подключение к PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/sandbox_db
spring.datasource.username=admin
spring.datasource.password=password

# Логирование SQL-запросов (полезно для отлова N+1)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=validate

# Подключение к Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Подключение к Apache Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=sandbox-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Liquibase
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.xml

# Outbox Publisher
outbox.polling.publisher.fixed.rate=5000
outbox.polling.publisher.batch.size=50

# Kafka topic
order.events.kafka.topic=order-events

# Redis TTL
order.events.redis.deduplication.ttl=PT24H
order.events.redis.deduplication.processing.ttl=PT10S
order.response.redis.cache.ttl=PT10M
order.response.redis.cache.ttl.jitter=PT10S

# Logging
#debug=true
